<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NodeIt</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="drag-region"></div>
        <div class="topbar-controls">
          <button id="about-btn" class="window-btn icon-btn about-btn" aria-label="About"></button>
          <button id="close-btn" class="window-btn icon-btn close-btn" aria-label="Close"></button>
        </div>
      </header>

      <main id="viewport" class="viewport">
        <canvas id="main-canvas"></canvas>
      </main>
    </div>

    <div id="context-menu" class="context-menu" hidden>
      <button id="menu-create-node" class="menu-item">Create Node</button>
      <button id="menu-create-image-node" class="menu-item">Create Image Node…</button>
      <button id="menu-add-image" class="menu-item">Add Image…</button>
      <button id="menu-frame-all" class="menu-item">Frame All</button>
      <hr class="menu-divider" />
      <button id="menu-open" class="menu-item">Open…</button>
      <button id="menu-save" class="menu-item">Save</button>
      <button id="menu-save-as" class="menu-item">Save As…</button>
    </div>

    <dialog id="about-dialog" class="about-dialog">
      <h2>NodeIt</h2>
      <p id="version-label">Version V1</p>
      <button id="about-close-btn" class="topbar-btn">OK</button>
    </dialog>

    <dialog id="delete-dialog" class="about-dialog">
      <h2>Delete selected item?</h2>
      <p>This action cannot be undone.</p>
      <div class="dialog-actions">
        <button id="delete-cancel-btn" class="topbar-btn">Cancel</button>
        <button id="delete-confirm-btn" class="topbar-btn delete-confirm">Delete</button>
      </div>
    </dialog>

    <script type="module" src="./renderer.js"></script>
  </body>
  </html>
